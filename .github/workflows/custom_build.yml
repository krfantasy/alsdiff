name: Custom Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or tag to build'
        required: false
        type: string
        default: 'master'
      commit_sha:
        description: 'Git commit SHA to build (leave empty to use branch HEAD)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: ubuntu
            arch: x86_64
          - os: macos-latest
            os_name: macos
            arch: arm64
          - os: macos-15-intel
            os_name: macos
            arch: x86_64
          - os: windows-latest
            os_name: windows
            arch: x86_64

    runs-on: ${{ matrix.os }}
    env:
      OPAMVAR_with_js: "false"
    outputs:
      # All matrix jobs compute the same version; surface it once for the
      # release job so the tag always matches the built zips.
      version: ${{ steps.version_info.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Determine what to checkout
          # If commit_sha is provided, use that; otherwise use the branch input
          ref: ${{ inputs.commit_sha || inputs.branch }}

      - name: Guard opam dependency filters
        shell: bash
        run: |
          if grep -n "with-native" dune-project alsdiff.opam; then
            echo "::error::Found deprecated with-native filter in package metadata."
            exit 1
          fi

      - name: Get version info
        id: version_info
        shell: bash
        env:
          # GitHub inputs must reach the script via env vars, never template
          # interpolation: "${{ inputs.branch }}" inside run: is shell
          # injection territory for a workflow with contents: write.
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          BRANCH_OR_TAG="${INPUT_BRANCH}"

          # Get commit SHA (use input if provided, otherwise get from HEAD)
          if [ -n "${INPUT_COMMIT_SHA}" ]; then
            COMMIT_SHA="${INPUT_COMMIT_SHA}"
          else
            COMMIT_SHA=$(git rev-parse HEAD)
          fi

          # Sanitize the branch/tag for use in file and tag names: '/' (and
          # friends) in branch names would otherwise turn the zip path into a
          # subdirectory and fail the asset upload.
          SANITIZED=$(printf '%s' "${BRANCH_OR_TAG}" | tr -cs 'A-Za-z0-9._-' '-' | sed -e 's/^-*//' -e 's/-*$//')

          # Short SHA (7 chars) for version format
          VERSION="${SANITIZED}-${COMMIT_SHA:0:7}"

          echo "branch_or_tag=${BRANCH_OR_TAG}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          echo "Building: ${VERSION}"
          echo "Branch/Tag: ${BRANCH_OR_TAG}"
          echo "Commit: ${COMMIT_SHA}"

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5

      - name: Install dependencies
        shell: bash
        run: source .github/scripts/ci-utils.sh && retry 10 opam install . --deps-only

      - name: Build native CLI target
        shell: bash
        run: opam exec -- dune build bin/alsdiff.exe

      - name: Prepare install tree
        shell: bash
        run: |
          mkdir -p install/bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp _build/default/bin/alsdiff.exe install/bin/alsdiff.exe
          else
            cp _build/default/bin/alsdiff.exe install/bin/alsdiff
          fi

      - name: Create zip (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          zip -j alsdiff-${{ matrix.os_name }}-${{ matrix.arch }}-${{ steps.version_info.outputs.version }}.zip install/bin/alsdiff

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd install/bin
          7z a ../../alsdiff-${{ matrix.os_name }}-${{ matrix.arch }}-${{ steps.version_info.outputs.version }}.zip alsdiff.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsdiff-${{ matrix.os_name }}-${{ matrix.arch }}-${{ steps.version_info.outputs.version }}
          path: alsdiff-${{ matrix.os_name }}-${{ matrix.arch }}-*.zip
          if-no-files-found: error

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create release with all platform assets
        uses: softprops/action-gh-release@v1
        with:
          files: assets/*.zip
          generate_release_notes: true
          tag_name: ${{ needs.build.outputs.version }}
          name: Build ${{ needs.build.outputs.version }}
          body: |
            Custom build from branch/commit: `${{ inputs.branch }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
